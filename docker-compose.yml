services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: healtrip
      POSTGRES_USER: healtrip
      POSTGRES_PASSWORD: healtrip
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://healtrip:healtrip@db:5432/healtrip
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      CORS_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: {pgdata: {}}
